# Secret scan (OWASP M9): gitleaks reads every commit of every branch this repository has,
# on every pull request, every push to main, and on demand. The whole history, every time,
# because this repository is PUBLIC: a key that was committed once and removed later is still
# readable by anyone in the old commit, so "the latest commit is clean" proves nothing. The
# history is a handful of commits; the full scan takes seconds.
#
# What it sees: gitleaks' default rules, which skip some paths altogether (lock files such as
# package-lock.json, node_modules/, images including SVG, fonts, office documents). A key in one
# of those passes green. This repository holds only YAML and a README, so there are none here.
#
# The same job the private repositories run (alert-gateway, reel-studio), with one change: they
# scan only the new commits of a push or a pull request, this one always scans everything.
#
# THIS WORKFLOW HOLDS NO SECRETS. It never reads `secrets.*`, and its token can read this
# repository and nothing else (`permissions: contents: read`). It uses `pull_request`, which
# gives a fork's pull request a read-only token and no secrets. `pull_request_target` would hand
# the secrets of this repository to code written in somebody else's fork; it must never appear
# here, as in watch.yml.
#
# ONE ACTION IS USED, GitHub's own actions/checkout, pinned to a full commit SHA with its version
# in the comment (OWASP M12): a moved tag cannot change what runs here. Resolved 2026-09-30 with
# `gh api repos/actions/checkout/git/ref/tags/v7.0.1`. watch.yml and heartbeat.yml, which do hold
# secrets, still use no actions at all.
#
# The gitleaks binary is not an action. It is downloaded from the gitleaks release and checked
# twice before it runs: against the hash written here, and against the release's own checksums
# file. Both have to agree.
#
# The log shows file, line, commit and rule of a finding. The secret itself is printed as
# "REDACTED" (--redact): a public repository has public logs.
#
# This job is not part of the watching. It does not share the `watch` concurrency group, never
# dispatches anything, and a red scan does not stop the uptime check.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit of every branch and tag, not only the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -O "$base/$tarball"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the whole history with the trusted rules
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The rules come from the trusted side, never from the commits being scanned. On a pull
          # request that is the base branch, so a pull request cannot allowlist its own secret by
          # adding a .gitleaks.toml or a .gitleaksignore. On a push it is the pushed commit, which
          # is main (the only branch a push triggers on). On a manual run it is the tip of the
          # default branch, not the commit that was run: a manual run on some other branch would
          # otherwise read that branch's own .gitleaksignore, and its green would say nothing about
          # main. Inline gitleaks:allow comments are ignored everywhere.
          rules="$RUNNER_TEMP/gitleaks-rules"
          mkdir -p "$rules"
          case "$EVENT" in
            pull_request) trusted="$PR_BASE" ;;
            push) trusted="$PUSH_AFTER" ;;
            *) trusted="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")" ;;
          esac
          echo "Rules and ignore list from ${trusted}."
          if git cat-file -e "${trusted}:.gitleaks.toml" 2>/dev/null; then
            git show "${trusted}:.gitleaks.toml" > "$rules/gitleaks.toml"
          else
            printf '[extend]\nuseDefault = true\n' > "$rules/gitleaks.toml"
          fi
          # gitleaks always reads the .gitleaksignore in the folder it scans, whatever the flags
          # say, so the checked-out copy is replaced by the trusted one (or removed). The scan
          # reads the commits through git, so the working tree changes nothing else.
          rm -f .gitleaksignore
          if git cat-file -e "${trusted}:.gitleaksignore" 2>/dev/null; then
            git show "${trusted}:.gitleaksignore" > .gitleaksignore
          fi
          # gitleaks reads the history through `git log -p`, and git applies the checked-out
          # .gitattributes files (any folder) to that output: a path marked `-diff` or `binary`
          # comes out as "Binary files differ" and is never scanned. One `* -diff` line and a key
          # beside it would pass green, and a later `*.txt -diff` on main would hide an old,
          # removed but still public key from every scan after it. .git/info/attributes outranks
          # every in-tree file, so this line makes every path of every commit readable text again.
          info_attributes="$(git rev-parse --git-path info/attributes)"
          mkdir -p "$(dirname "$info_attributes")"
          printf '* diff\n' > "$info_attributes"
          # No --log-opts: gitleaks then walks `git log --all`, every ref this clone fetched,
          # which on a pull request includes the pull request's own commits.
          gitleaks git --redact --verbose --no-banner --config "$rules/gitleaks.toml" --ignore-gitleaks-allow .
