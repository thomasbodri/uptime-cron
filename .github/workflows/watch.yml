# An uptime check that does not run on the machine it is watching.
#
# WHY THIS REPO IS PUBLIC. GitHub meters Actions minutes on private repositories, and a
# check running around the clock would spend the whole monthly allowance — which is also
# what deployments run on, so the watchdog would take them down with it. Public
# repositories get standard runners free and unmetered. That is the only reason, and it is
# why nothing identifying is written down here.
#
# PUBLIC REPOSITORY MEANS PUBLIC WORKFLOW LOGS. Anyone can read the output of these runs.
# GitHub masks the exact text of a secret, and nothing else — a hostname inside a curl error
# is not masked, because the error string is not equal to the secret. So:
#   * every identifying value is a secret, the target URL included;
#   * curl runs quiet, and its stderr is dropped rather than printed;
#   * no response body is ever echoed;
#   * no `set -x`.
# The log of a healthy run says "ok" and nothing else.
#
# NO ACTIONS ARE USED, not even actions/checkout. Nothing is checked out, so there is no
# third-party code in this workflow at all and nothing to pin, audit or keep updated.
#
# ONE RUN WATCHES FOR AN HOUR, because the cron line is a request, not a promise.
# `*/10` asks for 144 runs a day. GitHub's scheduler is best-effort and drops most
# high-frequency ticks on a free public repo: MEASURED over the 24h to 2026-09-10 11:46 UTC,
# SEVEN runs, median gap 3.5h, worst gap 5.1h. Two probes thirty seconds apart every few hours
# is not a watchdog, and nothing said so -- a throttled watchdog and a healthy one both produce
# silence, which is the one failure this repo exists to rule out.
#
# The scheduler cannot be argued with, so the RUN got longer instead: it keeps probing every
# two minutes for about fifty-five minutes and then exits. Coverage goes from a couple of
# seconds per gap to roughly an hour in every three or four. Runner minutes are free and
# unmetered on a public repo, which is the same reason this repo is public at all.
#
# EACH RUN STARTS THE NEXT ONE. An hour in every three or four is still two or three unwatched
# hours in a row, several times a day. So when a window closes, the run asks the API to
# dispatch this same workflow again. The scheduler's throttling does not apply to a
# dispatch: `workflow_dispatch` and `repository_dispatch` are the two events GitHub lets a
# run trigger with its own GITHUB_TOKEN. The cron line stays, as the thing that restarts the
# chain after anything breaks it -- a failed dispatch call, a GitHub outage, a runner that
# never came up. `concurrency` keeps the chain single: while a run is in progress at most one
# more waits, and a newer waiting run replaces an older one, so a cron tick that lands
# mid-window is simply superseded by the hand-over and shows as "cancelled" in the list.
# That is the normal look of this repo, not a fault.
#
# TO STOP THE CHAIN, disable the workflow in the Actions tab. A disabled workflow refuses the
# dispatch, the running window ends, and nothing restarts it. Deleting the cron line alone
# would NOT stop it.
#
# `permissions.actions: write` is the one right the token holds, and only so it can make that
# dispatch call. No third-party code runs here, so nothing can read it but this shell, and
# this shell never prints it.
#
# TRIGGERS ARE schedule AND workflow_dispatch ONLY. `pull_request_target` would hand these
# secrets to code written in somebody else's fork; it must never appear in this file.

name: watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      window_seconds:
        description: "How long this run watches (seconds). Only for testing the hand-over; a chained run always uses the default."
        required: false
        default: "3300"

permissions:
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Watch for an hour
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WINDOW_SECONDS_INPUT: ${{ github.event.inputs.window_seconds }}
          GH_TOKEN: ${{ github.token }}
          DISPATCH_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/watch.yml/dispatches
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -eu

          # A 200 is not proof. Cloudflare can serve a cached or Always-Online copy of a page
          # whose origin is gone, so the pass condition is the application's own JSON body.
          probe() {
            body=$(curl -s --max-time 15 -H 'cache-control: no-cache' "$TARGET_URL" 2>/dev/null || true)
            case "$body" in
              *'"status":"ok"'*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # HOW LONG ONE RUN WATCHES, and how often. 55 minutes at a 2-minute cadence is 27
          # probe rounds; the job's own timeout is 65 so the loop always ends itself rather
          # than being killed halfway through deciding something.
          WINDOW_SECONDS="${WINDOW_SECONDS_INPUT:-3300}"
          case "$WINDOW_SECONDS" in ''|*[!0-9]*) WINDOW_SECONDS=3300 ;; esac
          EVERY=120
          RE_ALERT_SECONDS=600

          started=$(date +%s)
          fails=0
          alerted_at=0
          exit_code=0

          # THE SEND IS CHECKED. A wrong token, a bot removed from the chat or a revoked chat
          # id all answer 200-with-"ok":false, so discarding the response gives a green run and
          # no message: a watchdog that has quietly stopped watching, which is the one failure
          # this whole thing exists to avoid. The response is INSPECTED, never echoed -- it
          # contains the chat and the message back.
          announce() {
            sent=$(curl -s --max-time 15 \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "text=$1" \
              2>/dev/null || true)
            case "$sent" in
              *'"ok":true'*) echo "alert delivered" ;;
              *) echo "ALERT NOT DELIVERED - Telegram refused the send"; return 1 ;;
            esac
          }

          while :; do
            now=$(date +%s)
            [ $((now - started)) -ge "$WINDOW_SECONDS" ] && break

            if probe; then
              # RECOVERY IS SILENCE, still. There is no state between runs, so an "it is back"
              # message could only ever describe this run's own window; the weekly heartbeat is
              # what makes silence mean something, and that has not changed.
              fails=0
              alerted_at=0
            else
              fails=$((fails + 1))
              # One miss is a blip. Two consecutive misses, two minutes apart, is an outage.
              if [ "$fails" -ge 2 ]; then
                if [ "$alerted_at" -eq 0 ] || [ $((now - alerted_at)) -ge "$RE_ALERT_SECONDS" ]; then
                  announce "🔴 DOWN: the app did not answer with status ok, twice, $((EVERY))s apart. This repeats every $((RE_ALERT_SECONDS / 60)) minutes until it recovers; recovery is silence." \
                    || exit_code=1
                  alerted_at=$now
                  exit_code=1
                fi
              fi
            fi
            sleep "$EVERY"
          done

          # HAND OVER before reporting, whatever this window saw: an outage is exactly when the
          # next window matters most. A 204 is the only success. Anything else is said out loud
          # (status only -- the body can name the repository) and the cron line takes over; the
          # chain is then a few hours from restarting instead of never.
          dispatched=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "$DISPATCH_URL" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"${DISPATCH_REF}\"}" 2>/dev/null || echo "000")
          if [ "$dispatched" = "204" ]; then
            echo "next window requested"
          else
            echo "NEXT WINDOW NOT REQUESTED - dispatch answered ${dispatched}; the schedule will restart the chain"
          fi

          # The run's verdict is about what it SAW, not about how it ended: a window that paged
          # is a failed run in the Actions list, which is where somebody looks afterwards.
          if [ "$exit_code" -eq 0 ]; then echo "ok - window closed with no outage"; fi
          exit "$exit_code"
